name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://apfslrzogelqceifhpky.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_7mLawFVKzbL4CIYVLWNigA_sfQzfoly
          VITE_R2_ACCOUNT_ID: d6da132f6857be3d32ac8e208ed184db
          VITE_R2_ACCESS_KEY_ID: 688440145d3f8d31279b5f04ee9b43f6
          VITE_R2_SECRET_ACCESS_KEY: 2f8b7a18e29200c5abbf82fff0b0f02645d305a4eba71d180c08a79921be9c79
          VITE_R2_BUCKET_NAME: thingor
          VITE_R2_PUBLIC_DOMAIN: https://media.thingor.com

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
